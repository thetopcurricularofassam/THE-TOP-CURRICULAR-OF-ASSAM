backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "updates"
    label: "Website Content Updates"
    folder: "posts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Job Vacancies", "Scholarships", "Forms Download", "Notices"] }
      - { label: "Upload File (PDF/Image)", name: "attachment", widget: "file", required: false }
      - { label: "YouTube Video Link (If any)", name: "youtube_link", widget: "string", required: false }
      - { label: "Details Description", name: "body", widget: "markdown" }
